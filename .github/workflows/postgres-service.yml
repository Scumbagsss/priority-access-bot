name: PostgreSQL deployment demo

on:
  push:
    paths:
      - "postgres_app/**"
      - "tests_postgres/**"
      - "requirements-postgres*.txt"
      - "alembic.ini"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "deployment.env.example"
      - ".github/workflows/postgres-service.yml"
  pull_request:
    paths:
      - "postgres_app/**"
      - "tests_postgres/**"
      - "requirements-postgres*.txt"
      - "alembic.ini"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "deployment.env.example"
      - ".github/workflows/postgres-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: PostgreSQL integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priority_ci
          POSTGRES_PASSWORD: synthetic_ci_password_not_for_reuse
          POSTGRES_DB: priority_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priority_ci -d priority_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: priority_ci
      POSTGRES_PASSWORD: synthetic_ci_password_not_for_reuse
      POSTGRES_DB: priority_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PostgreSQL demo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-postgres-dev.txt
      - name: Syntax checks
        run: python -m compileall -q postgres_app tests_postgres
      - name: Apply Alembic migration
        run: alembic upgrade head
      - name: Verify database migration revision
        run: alembic current
      - name: Execute API/PostgreSQL integration tests
        run: python -m pytest -q tests_postgres

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: priority_demo
      POSTGRES_DB: priority_demo
      POSTGRES_PASSWORD: synthetic_ci_compose_password_not_for_reuse
      APP_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        run: docker compose config -q
      - name: Build and start isolated stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check health, database readiness and authentication boundary
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/requests)" = "401"
      - name: Dump startup logs if failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove ephemeral containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
