name: Synthetic FastAPI demo

on:
  push:
    paths:
      - "api_demo/**"
      - "tests/test_api_demo.py"
      - "requirements-demo.txt"
      - ".github/workflows/api-demo.yml"
  pull_request:
    paths:
      - "api_demo/**"
      - "tests/test_api_demo.py"
      - "requirements-demo.txt"
      - ".github/workflows/api-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.txt
      - name: Compile synthetic API
        run: python -m compileall -q api_demo
      - name: Run HTTP and SQLite tests
        run: python -m pytest -q tests/test_api_demo.py
